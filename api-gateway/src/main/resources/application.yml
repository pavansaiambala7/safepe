server:
  port: 8080
  # Nginx terminates the client connection; without this the gateway sees the
  # proxy IP for every caller and rate limits would be shared by all of them.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        # ── 1. Payment Service Routes ─────────────────────────────────────────
        - id: payment-service-payments
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
        - id: payment-service-bank
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/bank/**
        - id: payment-service-utilities
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/utilities/**
        - id: payment-service-vault
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/vault/**
        - id: payment-service-history
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/history/**
        - id: payment-service-bills
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/bills/**

        # ── 2. Fraud Service Routes ───────────────────────────────────────────
        - id: fraud-service-fraud
          uri: lb://fraud-service
          predicates:
            - Path=/api/v1/fraud/**
        - id: fraud-service-assistant
          uri: lb://fraud-service
          predicates:
            - Path=/api/v1/assistant/**

        # ── 3. Notification Service Routes (SSE) ─────────────────────────────
        - id: notification-service-sse
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/public/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# ── SafePe Custom Configuration ─────────────────────────────────────────────
safepe:
  clerk:
    issuer: ${CLERK_ISSUER:https://creative-muskox-36.clerk.accounts.dev}
    jwks-url: ${CLERK_JWKS_URL:https://creative-muskox-36.clerk.accounts.dev/.well-known/jwks.json}

  # ── CORS ──────────────────────────────────────────────────────────────────
  # Comma-separated. Applied by CorsConfig#corsWebFilter, NOT by globalcors.
  # When the SPA is served by its own nginx (which proxies /api), requests are
  # same-origin and this list only matters for direct/non-browser clients.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

  # ── Bucket4j Rate Limiting ────────────────────────────────────────────────
  # capacity          = burst ceiling (tokens available when bucket is full)
  # refill-tokens     = tokens restored per refill-period-seconds
  # Longest matching path-prefix wins; unmatched paths use default-tier.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-buckets: 50000
    exempt-paths:
      # Long-lived SSE connection - throttling it kills the notification bell.
      - /api/v1/public/notifications/stream
      - /actuator
    default-tier:
      capacity: 40
      refill-tokens: 20
      refill-period-seconds: 1
    tiers:
      # Gemini-backed routes: each call costs real API quota. Keep these tight.
      - path-prefix: /api/v1/assistant
        capacity: 3
        refill-tokens: 1
        refill-period-seconds: 1
      - path-prefix: /api/v1/fraud
        capacity: 5
        refill-tokens: 2
        refill-period-seconds: 1
      # Money movement: strict, and low enough to blunt brute-force attempts.
      - path-prefix: /api/v1/payments
        capacity: 10
        refill-tokens: 5
        refill-period-seconds: 1
      - path-prefix: /api/v1/bank
        capacity: 10
        refill-tokens: 5
        refill-period-seconds: 1
      - path-prefix: /api/v1/vault
        capacity: 10
        refill-tokens: 5
        refill-period-seconds: 1
      # Read-mostly routes: generous.
      - path-prefix: /api/v1/history
        capacity: 60
        refill-tokens: 30
        refill-period-seconds: 1
      - path-prefix: /api/v1/bills
        capacity: 40
        refill-tokens: 20
        refill-period-seconds: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
