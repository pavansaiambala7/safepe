# ============================================================================
# SafePe Backend — Application Configuration
# ============================================================================
# All secrets are injected via environment variables. Never commit real values.
# ============================================================================

server:
  port: 8080

# ── PostgreSQL ───────────────────────────────────────────────────────────────
spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:h2:mem:safepe;DB_CLOSE_DELAY=-1
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  # ── JPA / Hibernate ──────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  # ── Redis — Vector Cache ────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ── Kafka — Event-Driven Messaging ──────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: safepe-fraud-detection-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# ── SafePe Custom Configuration ─────────────────────────────────────────────
safepe:

  # Gemini AI — fraud-risk scoring & embeddings
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-2.5-flash
    embedding-model: text-embedding-004
    base-url: https://generativelanguage.googleapis.com/v1beta

  # Razorpay — payment gateway
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

  # Clerk — authentication provider
  clerk:
    issuer: https://creative-muskox-36.clerk.accounts.dev
    jwks-url: https://creative-muskox-36.clerk.accounts.dev/.well-known/jwks.json

  # Vault — field-level encryption
  encryption:
    master-key: ${VAULT_MASTER_KEY}

  # RAG Pipeline — vector search configuration
  rag:
    cache-ttl-seconds: 300
    similarity-threshold: 0.75
    max-results: 5
