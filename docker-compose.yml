
services:
  # ── Layer 3: Data & Storage (PostgreSQL with pgvector) ──────────────────────
  db:
    image: pgvector/pgvector:pg15
    container_name: safepe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safepe_user}
      # No committed default: a password baked into a public repo is not a
      # password. Compose refuses to start until .env supplies one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-safepe_db}
    ports:
      # Loopback-only: reach it from the host or an SSH tunnel, not the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safepe_user} -d ${POSTGRES_DB:-safepe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis — Vector Cache & Session Store ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: safepe-redis
    ports:
      # Loopback-only: reach it from the host or an SSH tunnel, not the internet.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Apache Kafka — Event-Driven Messaging (KRaft Mode) ────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: safepe-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners on purpose. Containers resolve "kafka" and use :9092;
      # tools on the host cannot resolve that name, so they get :29092
      # advertised as localhost. Previously only PLAINTEXT://kafka:9092 was
      # advertised, so any client outside the Docker network was handed an
      # unresolvable broker address after connecting.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      # Loopback-only: reach it from the host or an SSH tunnel, not the internet.
      - "127.0.0.1:29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Netflix Eureka Discovery Server (:8761) ───────────────────────────────
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: safepe-eureka-server
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Spring Cloud API Gateway (:8080) ──────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: safepe-api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - CLERK_ISSUER=https://creative-muskox-36.clerk.accounts.dev
      - CLERK_JWKS_URL=https://creative-muskox-36.clerk.accounts.dev/.well-known/jwks.json
      # Only needed for non-browser or cross-origin clients; the SPA is
      # same-origin because nginx proxies /api.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
    depends_on:
      - eureka-server

  # ── Payment Service (:8081) ───────────────────────────────────────────────
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: safepe-payment-service
    # Port intentionally NOT published. These services use
    # .anyRequest().permitAll(), so exposing them let callers reach every
    # endpoint directly and skip the gateway JWT check and rate limits.
    # Reachable on the compose network as payment-service:8081.
    expose:
      - "8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-safepe_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-safepe_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      # Schema ownership toggles. Defaults are the production settings; set
      # HIBERNATE_DDL_AUTO=update + FLYWAY_ENABLED=false only when deliberately
      # regenerating a migration baseline from the entities.
      - FLYWAY_ENABLED=${FLYWAY_ENABLED:-true}
      - HIBERNATE_DDL_AUTO=${HIBERNATE_DDL_AUTO:-validate}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_T5AtiMDfqh5J2N}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET in .env}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:?set RAZORPAY_WEBHOOK_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started

  # ── Fraud Service (:8082) ─────────────────────────────────────────────────
  fraud-service:
    build:
      context: ./fraud-service
      dockerfile: Dockerfile
    container_name: safepe-fraud-service
    # Port intentionally NOT published. These services use
    # .anyRequest().permitAll(), so exposing them let callers reach every
    # endpoint directly and skip the gateway JWT check and rate limits.
    # Reachable on the compose network as fraud-service:8082.
    expose:
      - "8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-safepe_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-safepe_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      # Schema ownership toggles. Defaults are the production settings; set
      # HIBERNATE_DDL_AUTO=update + FLYWAY_ENABLED=false only when deliberately
      # regenerating a migration baseline from the entities.
      - FLYWAY_ENABLED=${FLYWAY_ENABLED:-true}
      - HIBERNATE_DDL_AUTO=${HIBERNATE_DDL_AUTO:-validate}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started

  # ── Notification Service (:8083) ──────────────────────────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: safepe-notification-service
    # Port intentionally NOT published. These services use
    # .anyRequest().permitAll(), so exposing them let callers reach every
    # endpoint directly and skip the gateway JWT check and rate limits.
    # Reachable on the compose network as notification-service:8083.
    expose:
      - "8083"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started

  # ── Layer 1: Presentation (React Frontend) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite inlines import.meta.env at BUILD time. These were previously set
        # under `environment:` (and misspelled VITE_VITE_*), so the compiled
        # bundle never saw them and rendered the "Missing Clerk Key" screen.
        # `:?` makes compose fail loudly rather than build a broken image.
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY in .env}
        VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_T5AtiMDfqh5J2N}
    container_name: safepe-frontend
    ports:
      # Nginx listens on 80 inside the container and reverse-proxies /api to
      # api-gateway:8080, so the SPA and the API share one origin.
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
