server:
  port: 8082
  # Stack traces and raw exception messages leaked internals through the
  # default /error endpoint. GlobalExceptionHandler now owns error bodies.
  error:
    include-stacktrace: never
    include-message: never
  # Preserve the original client IP through the nginx -> gateway hops so
  # logs attribute requests correctly.
  forward-headers-strategy: framework

spring:
  application:
    name: fraud-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:frauddb;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  # Flyway owns the schema. Each service writes its OWN history table: both
  # services share one database, and a single default flyway_schema_history
  # would have them overwriting each other's migration records.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    table: flyway_schema_history_fraud
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      # validate, not update: Hibernate no longer reshapes production tables on
      # boot. Override to "update" only when regenerating a migration baseline.
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: safepe-fraud-detection-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# ── SafePe Custom Configuration ─────────────────────────────────────────────
safepe:
  gemini:
    api-key: ${GEMINI_API_KEY:gemini_key_here}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    # text-embedding-004 was retired by Google (embedContent returns 404). When
    # embedding fails, VectorSearchService silently falls back to a keyword
    # search with a fixed 50% score - below the threshold - so every message,
    # scams included, was being ALLOWED.
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

  # Bound by RagProperties. These keys existed before but nothing read them -
  # VectorSearchService hardcoded the values as constants.
  rag:
    cache-ttl-seconds: 300
    # 0.75 for gemini-embedding-001, which scores higher overall than the
    # retired text-embedding-004. On the rag-eval set (12 scam paraphrases,
    # 6 legitimate look-alikes) scams scored 83.7-96.7% and legitimate
    # messages at most 70.6%; 0.60 flagged 4 of the 6 legitimate ones.
    # Re-tune with rag-eval/ if the embedding model changes again.
    similarity-threshold: 0.75
    max-results: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
