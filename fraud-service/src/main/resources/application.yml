server:
  port: 8082
  # Stack traces and raw exception messages leaked internals through the
  # default /error endpoint. GlobalExceptionHandler now owns error bodies.
  error:
    include-stacktrace: never
    include-message: never
  # Preserve the original client IP through the nginx -> gateway hops so
  # logs attribute requests correctly.
  forward-headers-strategy: framework

spring:
  application:
    name: fraud-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:frauddb;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  # Flyway owns the schema. Each service writes its OWN history table: both
  # services share one database, and a single default flyway_schema_history
  # would have them overwriting each other's migration records.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    table: flyway_schema_history_fraud
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      # validate, not update: Hibernate no longer reshapes production tables on
      # boot. Override to "update" only when regenerating a migration baseline.
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Matches the @KafkaListener groupId in PaymentEventConsumer, which
      # overrides this anyway; kept in sync so the config does not mislead.
      group-id: safepe-ai-readmodel-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# ── SafePe Custom Configuration ─────────────────────────────────────────────
safepe:
  gemini:
    api-key: ${GEMINI_API_KEY:gemini_key_here}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

  # Bound by RagProperties. These keys existed before but nothing read them -
  # VectorSearchService hardcoded the values as constants.
  rag:
    cache-ttl-seconds: 300
    # 0.60, not the 0.75 this file used to declare. 0.60 is the value the
    # constant actually applied, so it is what the deployed system has been
    # tuned against; raising it here would silently drop current matches.
    similarity-threshold: 0.60
    max-results: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
