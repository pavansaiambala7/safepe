# ── SafePe Frontend — Nginx (static SPA + reverse proxy to API Gateway) ──────
# Serving the SPA and proxying /api from the SAME origin removes the need for
# CORS in the browser and keeps the gateway off the public internet.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS. Combined with the $gateway variable below, this
    # defers upstream resolution to request time. A plain `upstream` block or a
    # literal hostname in proxy_pass is resolved at STARTUP, so nginx would
    # refuse to boot with "host not found in upstream" whenever api-gateway is
    # slow to come up, taking the whole SPA down with it.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Container healthcheck target that does not depend on the gateway.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Never let a stale index.html pin users to a deleted JS bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SSE notification stream ──────────────────────────────────────────────
    # Must come BEFORE the generic /api/ block. Buffering would hold events in
    # nginx until the buffer filled, which breaks the notification bell.
    location /api/v1/public/notifications/stream {
        set $gateway_sse "api-gateway:8080";
        proxy_pass                http://$gateway_sse$request_uri;

        proxy_http_version        1.1;
        proxy_set_header          Connection "";
        proxy_set_header          Host $host;
        proxy_set_header          X-Real-IP $remote_addr;
        proxy_set_header          X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header          X-Forwarded-Proto $scheme;

        proxy_buffering           off;
        proxy_cache               off;
        chunked_transfer_encoding off;
        proxy_read_timeout        24h;
        proxy_send_timeout        24h;
    }

    # ── All other API traffic ────────────────────────────────────────────────
    location /api/ {
        set $gateway "api-gateway:8080";
        proxy_pass              http://$gateway$request_uri;

        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        # The gateway keys rate-limit buckets off this when the caller is
        # anonymous. Without it every client would share one bucket.
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;

        # Surface gateway error bodies (401/429/502) to the SPA verbatim
        # instead of replacing them with nginx HTML error pages.
        proxy_intercept_errors  off;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Deep links such as /dashboard must return index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/x-font-ttf font/woff2;

    # Do not advertise the nginx version.
    server_tokens off;
}
