server:
  port: 8083
  # Stack traces and raw exception messages leaked internals through the
  # default /error endpoint. GlobalExceptionHandler now owns error bodies.
  error:
    include-stacktrace: never
    include-message: never
  # Preserve the original client IP through the nginx -> gateway hops so
  # logs attribute requests correctly.
  forward-headers-strategy: framework

spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: safepe-notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
