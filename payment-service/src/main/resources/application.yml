server:
  port: 8081
  # Stack traces and raw exception messages leaked internals through the
  # default /error endpoint. GlobalExceptionHandler now owns error bodies.
  error:
    include-stacktrace: never
    include-message: never
  # Preserve the original client IP through the nginx -> gateway hops so
  # logs attribute requests correctly.
  forward-headers-strategy: framework

spring:
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  # Flyway owns the schema. Each service writes its OWN history table: both
  # services share one database, and a single default flyway_schema_history
  # would have them overwriting each other's migration records.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    table: flyway_schema_history_payment
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      # validate, not update: Hibernate no longer reshapes production tables on
      # boot. Override to "update" only when regenerating a migration baseline.
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# ── SafePe Custom Configuration ─────────────────────────────────────────────
safepe:
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_T5AtiMDfqh5J2N}
    key-secret: ${RAZORPAY_KEY_SECRET:dummy_secret}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:dummy_webhook_secret}

  # safepe.encryption.master-key was removed: no class in this service ever
  # read it, so it was a real-looking secret committed to a public repo that
  # protected nothing. Card data is handled by storing a provider token plus
  # the last four digits (TokenizationService), not by encrypting PANs here.
  # Re-add it alongside an actual Cipher if that changes.

management:
  endpoints:
    web:
      exposure:
        include: health,info
