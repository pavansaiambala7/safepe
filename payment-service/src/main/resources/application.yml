server:
  port: 8081

spring:
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# ── SafePe Custom Configuration ─────────────────────────────────────────────
safepe:
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_T5AtiMDfqh5J2N}
    key-secret: ${RAZORPAY_KEY_SECRET:dummy_secret}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:dummy_webhook_secret}

  encryption:
    master-key: ${VAULT_MASTER_KEY:vF9wE2xP8sT4qU7yZ1bM5cN3kV8aH6rJ}

management:
  endpoints:
    web:
      exposure:
        include: health,info
