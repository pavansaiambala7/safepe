# Test profile: no Eureka, PostgreSQL instead of the H2 defaults.
# Connection details for PostgreSQL/Kafka come from Testcontainers (@ServiceConnection).
eureka:
  client:
    enabled: false
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
